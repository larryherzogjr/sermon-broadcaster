<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History — Sermon Broadcaster</title>
    <style>
        :root {
            --bg: #1a1a1e;
            --surface: #24242a;
            --surface-raised: #2e2e36;
            --border: #3a3a44;
            --text: #e8e6e1;
            --text-muted: #9a978f;
            --accent: #c9a84c;
            --accent-dim: #8a7333;
            --green: #5a9a6a;
            --red: #b05050;
            --blue: #5a7a9a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Source Serif 4', Georgia, serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent);
        }

        header a {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        header a:hover { color: var(--accent); }

        .job-row {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 1.25rem 1.5rem;
            margin-bottom: 1rem;
        }

        .job-row .top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 1rem;
            margin-bottom: 0.75rem;
            flex-wrap: wrap;
        }

        .job-row .title {
            font-size: 1.05rem;
            color: var(--text);
            font-weight: 600;
        }

        .job-row .date {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 0.05em;
        }

        .badge {
            display: inline-block;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            padding: 0.18rem 0.55rem;
            border-radius: 3px;
            margin-left: 0.25rem;
        }
        .badge.complete { background: var(--green); color: #fff; }
        .badge.failed   { background: var(--red);   color: #fff; }
        .badge.awaiting_review { background: var(--blue); color: #fff; }
        .badge.queued, .badge.running, .badge.analyzing, .badge.rendering { background: var(--accent-dim); color: #fff; }
        .badge.feedback-none       { background: var(--surface-raised); color: var(--text-muted); }
        .badge.feedback-in_progress{ background: var(--blue); color: #fff; }
        .badge.feedback-submitted  { background: var(--accent-dim); color: #fff; }

        .actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
        }

        .btn {
            display: inline-block;
            padding: 0.45rem 0.9rem;
            border-radius: 4px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-decoration: none;
            transition: background 0.2s, opacity 0.2s;
            border: 0;
            cursor: pointer;
        }
        .btn-download {
            background: var(--green);
            color: #fff;
        }
        .btn-download:hover { background: #6aaa7a; }
        .btn-download.disabled {
            background: var(--surface-raised);
            color: var(--text-muted);
            cursor: not-allowed;
            opacity: 0.6;
            text-decoration: line-through;
        }
        .btn-feedback {
            background: var(--accent);
            color: var(--bg);
        }
        .btn-feedback:hover { background: #d4b358; }
        .btn-feedback.submitted {
            background: var(--surface-raised);
            color: var(--accent);
            border: 1px solid var(--accent-dim);
        }
        .btn-delete {
            margin-left: auto;
            background: transparent;
            color: #d98080;
            border: 1px solid var(--red);
        }
        .btn-delete:hover { background: var(--red); color: #fff; }
        .btn-delete:disabled { cursor: wait; opacity: .55; }

        .empty {
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            padding: 3rem;
        }

        .meta {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
    <link rel="stylesheet" href="/static/ui.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Job History</h1>
            <a href="/">+ Start New Broadcast</a>
        </header>

        <div id="list">
            <div class="empty">Loading…</div>
        </div>
    </div>

    <script>
        const APP_TIME_ZONE = {{ app_timezone | tojson }};
        const VARIANT_LABELS = {
            'dynamic': 'Dynamic Teaser',
            'stock': 'Stock Teaser',
            'sermon-only': 'Sermon Only',
        };

        function escHtml(s) {
            const d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }

        function fmtDate(iso) {
            if (!iso) return '—';
            // Before timestamps carried an explicit offset, production stored
            // UTC as a timezone-less ISO string. Preserve those existing rows.
            const normalized = /(?:Z|[+-]\d\d:\d\d)$/.test(iso) ? iso : `${iso}Z`;
            const d = new Date(normalized);
            if (isNaN(d.getTime())) return iso;
            return d.toLocaleString(undefined, {
                timeZone: APP_TIME_ZONE,
                timeZoneName: 'short',
            });
        }

        function renderRow(job) {
            const r = job.result || {};
            const b = r.boundaries || {};
            const title = b.sermon_title_guess || (job.review && job.review.title) || job.source || '(no title)';
            const statusClass = job.status;

            const fb = job.feedback || { status: 'none' };
            const fbLabel = {
                'none': 'No Feedback',
                'in_progress': 'Feedback in Progress',
                'submitted': 'Feedback Submitted',
            }[fb.status] || fb.status;

            const outputs = (r.outputs || []);
            const downloadHtml = outputs.map(out => {
                const label = VARIANT_LABELS[out.variant] || out.variant || 'Download';
                if (out.available) {
                    return `<a class="btn btn-download" href="/api/download/${encodeURIComponent(out.filename)}">${escHtml(label)}</a>`;
                }
                return `<span class="btn btn-download disabled" title="File expired or removed">${escHtml(label)} (expired)</span>`;
            }).join('');

            let jobAction = '';
            if (job.status === 'awaiting_review') {
                jobAction = `<a class="btn btn-feedback next-action" href="/?job=${encodeURIComponent(job.job_id)}">Continue Review</a>`;
            } else if (['queued', 'running', 'analyzing', 'rendering'].includes(job.status)) {
                jobAction = `<a class="btn btn-feedback next-action" href="/?job=${encodeURIComponent(job.job_id)}">View Progress</a>`;
            } else if (job.status === 'failed') {
                jobAction = `<a class="btn btn-feedback next-action" href="/?job=${encodeURIComponent(job.job_id)}">View Details</a>`;
            } else if (job.status === 'complete') {
                jobAction = `<a class="btn btn-feedback next-action" href="/?job=${encodeURIComponent(job.job_id)}">View Finished Job</a>`;
                if (fb.status === 'none') {
                    jobAction += `<a class="btn btn-feedback" href="/feedback/${encodeURIComponent(job.job_id)}">Submit Feedback</a>`;
                } else if (fb.status === 'in_progress') {
                    jobAction += `<a class="btn btn-feedback" href="/feedback/${encodeURIComponent(job.job_id)}">Continue Feedback</a>`;
                } else if (fb.status === 'submitted' && fb.issue_url) {
                    jobAction += `<a class="btn btn-feedback submitted" href="${escHtml(fb.issue_url)}" target="_blank" rel="noopener">View Issue &rarr;</a>`;
                }
            }

            return `
                <div class="job-row" data-job-row="${escHtml(job.job_id)}">
                    <div class="top">
                        <div>
                            <div class="title">${escHtml(title)}</div>
                            <div class="meta">
                                job ${escHtml(job.job_id)} &middot; target ${escHtml(job.target_duration)}
                                <span class="badge ${statusClass}">${escHtml(job.status.replaceAll("_", " "))}</span>
                                ${fb.status === "none" ? "" : `<span class="badge feedback-${fb.status}">${escHtml(fbLabel)}</span>`}
                            </div>
                        </div>
                        <div class="date">${escHtml(fmtDate(job.created_at))}</div>
                    </div>
                    <div class="actions">
                        ${downloadHtml}
                        ${jobAction}
                        <button class="btn btn-delete" type="button" data-delete-job="${escHtml(job.job_id)}" data-delete-title="${escHtml(title)}">Delete</button>
                    </div>
                </div>
            `;
        }

        async function deleteJob(button) {
            const jobId = button.dataset.deleteJob;
            const title = button.dataset.deleteTitle || 'this job';
            const confirmed = window.confirm(
                `Delete "${title}" (job ${jobId})?\n\n` +
                'This permanently abandons any processing and removes the session, cached review audio, generated downloads, and local feedback records. This cannot be undone.'
            );
            if (!confirmed) return;

            button.disabled = true;
            button.textContent = 'Deleting…';
            try {
                const response = await fetch(`/api/jobs/${encodeURIComponent(jobId)}`, {method: 'DELETE'});
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'The job could not be deleted.');
                const row = button.closest('[data-job-row]');
                if (row) row.remove();
                const list = document.getElementById('list');
                if (!list.querySelector('[data-job-row]')) {
                    list.innerHTML = '<div class="empty">No jobs yet.</div>';
                }
            } catch (error) {
                button.disabled = false;
                button.textContent = 'Delete';
                window.alert(error.message);
            }
        }

        document.getElementById('list').addEventListener('click', event => {
            const button = event.target.closest('[data-delete-job]');
            if (button) deleteJob(button);
        });

        fetch('/api/history')
            .then(r => r.json())
            .then(jobs => {
                const list = document.getElementById('list');
                if (!jobs.length) {
                    list.innerHTML = '<div class="empty">No jobs yet.</div>';
                    return;
                }
                list.innerHTML = jobs.map(renderRow).join('');
            })
            .catch(err => {
                document.getElementById('list').innerHTML =
                    `<div class="empty">Failed to load history: ${escHtml(err.message)}</div>`;
            });
    </script>
</body>
</html>
